name: Refactor Roslyn CI

on:
  push:
    branches:
      - chan989/metadata-reference-resolver
    paths:
      - '.github/workflows/refactor-ci.yml'
      - 'mdl/**'
      - 'Tools/RefactorRoslynSmoke/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  roslyn-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Tools/RefactorRoslynSmoke/RefactorRoslynSmoke.csproj
      - name: Run Roslyn regression smoke tests
        run: dotnet run --project Tools/RefactorRoslynSmoke/RefactorRoslynSmoke.csproj --no-restore --configuration Release
