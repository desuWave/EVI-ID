name: Refactor Roslyn CI

on:
  push:
    branches:
      - chan989/metadata-reference-resolver
    paths:
      - '.github/workflows/refactor-ci.yml'
      - 'mdl/**'
      - 'Tools/RefactorRoslynSmoke/**'
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

jobs:
  roslyn-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Tools/RefactorRoslynSmoke/RefactorRoslynSmoke.csproj
      - name: Run Roslyn regression smoke tests
        run: dotnet run --project Tools/RefactorRoslynSmoke/RefactorRoslynSmoke.csproj --no-restore --configuration Release

      - name: Publish commit status
        if: ${{ always() }}
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const state = '${{ job.status }}' === 'success' ? 'success' : 'failure';
            await github.rest.repos.createCommitStatus({
              owner: context.repo.owner,
              repo: context.repo.repo,
              sha: context.sha,
              state,
              context: 'EVI-ID / Refactor Roslyn CI',
              description: state === 'success'
                ? 'Roslyn smoke tests passed'
                : 'Roslyn smoke tests failed or did not complete',
              target_url: `https://github.com/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
